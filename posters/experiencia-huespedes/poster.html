<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Experiencia de huéspedes 77Rentals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
:root{--purple:#341D63;--purple-dark:#251547;--purple-light:#F1EEF6;--purple-logo:#3B2055;--gold:#CBA54D;--white:#fff;
--font-heading:'Fraunces',Georgia,serif;--font-body:'General Sans',system-ui,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff}
.poster{width:1080px;height:1350px;position:relative;overflow:hidden;background:#fff;color:var(--purple);
 display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 90px 0}
/* decorative circles, Canva style */
.c1{position:absolute;top:-170px;right:-170px;width:460px;height:460px;border-radius:50%;background:var(--purple-light)}
.c2{position:absolute;top:1075px;left:-90px;width:200px;height:200px;border-radius:50%;border:3px solid var(--gold);opacity:.7}
.c3{position:absolute;top:560px;right:-60px;width:150px;height:150px;border-radius:50%;background:var(--gold);opacity:.18}
.logo{position:relative;width:300px;border-radius:28px;display:block;box-shadow:0 14px 34px rgba(52,29,99,.28)}
.eyebrow{position:relative;margin-top:44px;font-family:var(--font-body);font-weight:600;font-size:23px;letter-spacing:.32em;text-transform:uppercase}
.rule{position:relative;width:120px;height:4px;background:var(--gold);border-radius:2px;margin:22px auto 34px}
.t1{position:relative;font-family:var(--font-heading);font-style:italic;font-weight:400;font-size:42px;line-height:1.3}
.t2{position:relative;margin-top:34px;font-family:var(--font-heading);font-weight:800;font-size:96px;line-height:1.02;letter-spacing:-.02em}
.t3{position:relative;margin-top:10px;font-family:var(--font-body);font-weight:500;font-size:46px;line-height:1.25}
.t3 b{font-family:var(--font-heading);font-weight:600;font-style:italic;font-size:54px}
.heart{position:relative;margin:34px 0 20px;width:64px;height:64px}
.t4{position:relative;font-family:var(--font-heading);font-weight:600;font-size:50px;line-height:1.2}
.t4 em{font-style:italic;font-weight:400;font-size:70px;display:inline-block;line-height:1.1;
 background:linear-gradient(transparent 82%,rgba(203,165,77,.65) 82%,rgba(203,165,77,.65) 94%,transparent 94%)}
.footer{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--purple-logo);color:#fff;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body)}
.footer .a{font-size:30px;font-weight:600;letter-spacing:.04em}
.footer .b{font-size:24px;font-weight:400;color:#E0C585}
</style>
</head>
<body>
<div class="poster">
  <div class="c1"></div><div class="c2"></div><div class="c3"></div>
  <img class="logo" src="logo77.jpeg" alt="77Rentals">
  <div class="eyebrow">Experiencias de huéspedes</div>
  <div class="rule"></div>
  <p class="t1">En estas dos últimas semanas no he compartido experiencias de mis huéspedes,</p>
  <h1 class="t2">pero hoy</h1>
  <p class="t3">les quiero compartir esta<br>con <b>mucha felicidad</b></p>
  <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="#CBA54D" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.8 1.1 5.4 3.1 1.6-2 3.4-3.1 5.4-3.1 3.6 0 5.7 3.7 4.2 7.2C19.500 16.400 12 21 12 21z"/></svg>
  <p class="t4">Y hoy quiero compartirles esta que me <em>conmovió el corazón</em></p>
  <div class="footer">
    <div class="a">Escríbenos por WhatsApp: +57 304 673 6241</div>
    <div class="b">77rentals.com</div>
  </div>
</div>
</body>
</html>
