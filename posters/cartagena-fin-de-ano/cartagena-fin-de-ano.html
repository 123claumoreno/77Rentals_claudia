<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartagena fin de año 77Rentals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
  :root {
    --purple: #341D63;
    --purple-dark: #251547;
    --purple-logo: #3B2055;
    --gold: #CBA54D;
    --gold-light: #E0C585;
    --white: #FFFFFF;
    --font-heading: 'Fraunces', Georgia, serif;
    --font-body: 'General Sans', system-ui, sans-serif;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--purple-logo); }
  body { font-family: var(--font-body); color: var(--white); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .poster { position: relative; width: 210mm; height: 297mm; overflow: hidden; background: var(--purple-logo); }

  /* Photo */
  .photo { position: absolute; left: 0; top: 0; width: 210mm; height: 150mm; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; display: block; }
  .photo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(59,32,85,.0) 38%, rgba(59,32,85,.82) 80%, #3B2055 100%); }

  .badge { position: absolute; top: 14mm; left: 16mm; z-index: 2; background: var(--gold); color: var(--purple-dark);
    font-size: 10pt; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; padding: 2.6mm 5mm; border-radius: 10mm; }

  .headline { position: absolute; left: 16mm; right: 16mm; top: 100mm; z-index: 2; }
  h1 { font-family: var(--font-heading); font-weight: 400; font-optical-sizing: auto; font-size: 41pt; line-height: 1.04; }
  h1 em { font-style: normal; color: var(--gold-light); }

  /* Message */
  .message { position: absolute; left: 16mm; right: 16mm; top: 153mm; }
  .rule { width: 22mm; height: 1.2mm; background: var(--gold); border-radius: 1mm; }
  .only { display: flex; align-items: center; gap: 7mm; margin-top: 7mm; }
  .big { font-family: var(--font-heading); font-weight: 500; font-size: 78pt; line-height: 1; color: var(--gold);
    border: .6mm solid var(--gold); border-radius: 50%; width: 31mm; height: 31mm; display: flex; align-items: center; justify-content: center; flex: none; padding-bottom: 1mm; }
  .only p { text-wrap: balance; font-size: 17pt; line-height: 1.3; font-weight: 500; }
  .only p strong { color: var(--gold-light); font-weight: 600; }
  .ask { font-family: var(--font-heading); font-size: 28pt; line-height: 1.15; margin-top: 6mm; }

  /* Contact */
  .contact { position: absolute; left: 16mm; right: 16mm; top: 212mm; display: flex; align-items: center; gap: 7mm;
    background: var(--white); color: var(--purple); border-radius: 4mm; padding: 5mm 6mm; }
  .contact .qr { width: 27mm; height: 27mm; flex: none; }
  .contact .qr img { width: 100%; height: 100%; display: block; }
  .contact .label { font-size: 9.5pt; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted, #6F677E); }
  .contact .cta { font-family: var(--font-heading); font-size: 23pt; line-height: 1.12; margin-top: 1.5mm; }
  .contact .phone { font-size: 20pt; font-weight: 600; margin-top: 2mm; color: var(--purple); }
  .contact .phone::before { content: ""; display: inline-block; width: 6mm; height: 1mm; background: var(--gold); border-radius: 1mm; vertical-align: middle; margin-right: 3mm; }

  /* Footer */
  footer { position: absolute; left: 16mm; right: 16mm; bottom: 10mm; display: flex; align-items: center; justify-content: space-between; border-top: .3mm solid rgba(224,197,133,.45); padding-top: 5mm; }
  footer img { height: 24mm; display: block; }
  .host { text-align: right; }
  .host .small { font-size: 10pt; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-light); font-weight: 600; }
  .host .name { font-family: var(--font-heading); font-size: 22pt; margin-top: 1mm; }
  .host .web { font-size: 10.5pt; margin-top: 2mm; opacity: .9; }
</style>
</head>
<body>
<div class="poster">
  <div class="photo"><img src="foto.jpg" alt="Atardecer sobre Cartagena"></div>
  <div class="badge">Fin de año</div>
  <div class="headline"><h1>¿Estás pensando viajar a <em>Cartagena</em>?</h1></div>

  <div class="message">
    <div class="rule"></div>
    <div class="only">
      <div class="big">2</div>
      <p>Solo nos quedan <strong>2 hospedajes</strong> disponibles para fin de año.</p>
    </div>
    <div class="ask">¿Qué esperas para reservar?</div>
  </div>

  <div class="contact">
    <div class="qr"><img src="qr-whatsapp.svg" alt="QR WhatsApp"></div>
    <div>
      <div class="label">Reserva por WhatsApp</div>
      <div class="cta">Escríbenos ahora</div>
      <div class="phone">+57 304 673 6241</div>
    </div>
  </div>

  <footer>
    <img src="logo77.jpeg" alt="77Rentals">
    <div class="host">
      <div class="small">Your host</div>
      <div class="name">Claudia Moreno</div>
      <div class="web">77rentals.com · @co77rentals</div>
    </div>
  </footer>
</div>
</body>
</html>
