<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fin de año 77Rentals, historia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Great+Vibes&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
  :root { --purple:#341D63; --purple-dark:#251547; --purple-logo:#3B2055; --gold:#CBA54D; --gold-light:#E0C585; --white:#fff; --red:#D91E2E;
    --font-heading:'Fraunces',Georgia,serif; --font-body:'General Sans',system-ui,sans-serif; --font-script:'Great Vibes','Brush Script MT',cursive; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#222; font-family:var(--font-body); color:var(--white); }
  .slide { width:1080px; height:1920px; background:var(--purple-logo); position:relative; overflow:hidden; }
  .frame { position:absolute; inset:34px; border:3px solid var(--gold); }
  .frame::before { content:""; position:absolute; inset:12px; border:1.5px solid rgba(203,165,77,.45); }
  .safe { position:absolute; left:80px; right:80px; top:240px; bottom:260px; display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:space-between; }

  .logo { height:170px; display:block; }
  .stage { position:relative; width:100%; height:222px; display:flex; align-items:center; justify-content:center; }
  .stage::before { content:""; position:absolute; left:-80px; right:-80px; top:50%; height:200px; transform:translateY(-50%) rotate(-10deg); background:repeating-linear-gradient(135deg, rgba(203,165,77,.16) 0 14px, transparent 14px 34px); }
  .stamp { position:relative; transform:rotate(-10deg); background:var(--red); border:9px solid #fff; outline:7px solid var(--red); border-radius:20px; padding:4px 48px 16px; box-shadow:0 20px 40px rgba(0,0,0,.45); }
  .stamp::after { content:""; position:absolute; inset:10px; border:3px solid rgba(255,255,255,.7); border-radius:10px; }
  .stamp h1 { font-family:var(--font-heading); font-weight:500; font-size:124px; line-height:1.05; letter-spacing:.04em; white-space:nowrap; text-shadow:0 4px 0 rgba(0,0,0,.25); }

  .city-big { padding-top:18px; font-family:var(--font-script); font-size:150px; line-height:.95; color:var(--gold); }
  .sub { font-weight:600; font-size:30px; letter-spacing:.3em; text-transform:uppercase; margin-top:4px; }
  .pill { background:#fff; color:var(--purple-dark); border-radius:60px; padding:12px 50px; font-weight:600; font-size:28px; letter-spacing:.3em; text-transform:uppercase; }
  .cards { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  .card { background:#fff; border:6px solid var(--gold); border-radius:26px; color:var(--purple-dark); padding:24px 12px 26px; box-shadow:0 14px 30px rgba(0,0,0,.35); }
  .card .city { font-family:var(--font-heading); font-weight:500; font-size:54px; line-height:1.1; }
  .card .n { font-family:var(--font-heading); font-style:italic; font-size:40px; margin-top:8px; color:var(--purple); }
  .card .line { width:80px; height:6px; background:var(--gold); margin:14px auto; border-radius:3px; }
  .card .sec { font-weight:600; font-size:20px; letter-spacing:.3em; text-transform:uppercase; color:var(--purple); }
  .card .sn { font-family:var(--font-script); font-size:66px; line-height:1; margin-top:4px; color:var(--purple-dark); }
  .tours { background:#fff; color:var(--purple-dark); border-radius:70px; padding:14px 52px; font-family:var(--font-heading); font-size:44px; }
  .tours em { color:var(--red); font-style:italic; }
  .host { width:100%; border-top:3px solid var(--gold); padding-top:22px; display:flex; align-items:center; justify-content:center; gap:60px; }
  .ht { text-align:left; }
  .hl { font-family:var(--font-script); font-size:56px; color:var(--gold-light); line-height:1; }
  .hn { font-family:var(--font-heading); font-size:56px; line-height:1.05; }
  .hp { font-weight:600; font-size:32px; margin-top:6px; }
  .qr { background:#fff; padding:12px; border-radius:16px; text-align:center; }
  .qr img { width:110px; height:110px; display:block; }
  .qr small { display:block; color:var(--purple); font-size:14px; font-weight:600; margin-top:5px; letter-spacing:.06em; }
</style>
</head>
<body>
<div class="slide"><div class="frame"></div>
  <div class="safe">
    <img class="logo" src="../../../brand/logos/logo77.jpeg" alt="77Rentals">
    <div class="stage"><div class="stamp"><h1>SOLD OUT</h1></div></div>
    <div><div class="city-big">Barranquilla</div><div class="sub">Para fin de año</div></div>
    <div class="pill">Aún disponible</div>
    <div class="cards">
      <div class="card"><div class="city">Cartagena</div><div class="n">2 apartamentos</div><div class="line"></div><div class="sec">Sector</div><div class="sn">Bocagrande</div></div>
      <div class="card"><div class="city">Santa Marta</div><div class="n">1 apartamento</div><div class="line"></div><div class="sec">Sector</div><div class="sn">Cabo Tortuga</div></div>
    </div>
    <div class="tours">Reserva los tours <em>con tiempo.</em></div>
    <div class="host">
      <div class="ht"><div class="hl">Your host</div><div class="hn">Claudia Moreno</div><div class="hp">WhatsApp 304 673 6241</div></div>
      <div class="qr"><img src="qr-whatsapp.svg" alt="QR WhatsApp"><small>ESCRÍBENOS</small></div>
    </div>
  </div>
</div>
</body>
</html>
