<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historieta Hasta pronto Camilo, 77Rentals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
  /* Historieta animada, 1080x1920, 30 s, 10 viñetas de 3 s. Frames drawn by render(t) so the export is deterministic.
     Text stays inside y 250..1670. Same five characters (same faces and clothes) in every vignette. */
  :root { --purple:#341D63; --purple-dark:#251547; --purple-light:#F1EEF6; --purple-logo:#3B2055; --gold:#CBA54D; --gold-light:#E0C585;
    --coral:#FF6B5B; --turq:#12B5B0; --sun:#FFC93C; --font-heading:'Fraunces',Georgia,serif; --font-body:'General Sans',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:var(--purple-logo); }
  body { font-family:var(--font-body); position:relative; }
  .slide { position:absolute; inset:0; background:linear-gradient(180deg,#3B2055 0%,#2A1650 100%); overflow:hidden; transform:translateX(1080px); }
  .slide::after { content:""; position:absolute; left:0; right:0; bottom:0; height:14px; background:var(--gold); }
  .ttl { position:absolute; left:60px; right:60px; top:250px; height:128px; text-align:center; color:#fff; font-family:var(--font-heading); font-weight:500; font-size:66px; line-height:1.02; text-wrap:balance; display:flex; align-items:center; justify-content:center; gap:22px; }
  .ttl svg { width:64px; height:64px; flex:none; }
  .ttl::after { content:""; position:absolute; left:50%; bottom:-22px; width:150px; height:8px; margin-left:-75px; border-radius:4px; background:var(--gold); }
  .panel { position:absolute; left:80px; top:395px; width:920px; height:900px; border-radius:46px; overflow:hidden; border:10px solid #fff; box-shadow:0 0 0 8px var(--gold); background:#fff; }
  .panel > * { position:absolute; left:0; top:0; }
  .panel svg.bg, .panel svg.fx { width:920px; height:900px; }
  .stage { width:920px; height:900px; }
  .fig { position:absolute; left:0; top:0; width:200px; height:400px; transform-origin:100px 400px; }
  .fig svg { width:200px; height:400px; overflow:visible; display:block; }
  .cap { position:absolute; left:80px; right:80px; top:1365px; background:#fff; color:var(--purple); border-radius:40px; padding:38px 46px; text-align:center; font-weight:600; font-size:50px; line-height:1.28; box-shadow:0 0 0 6px var(--gold); text-wrap:balance; }
  .cap::before { content:""; position:absolute; top:-30px; left:50%; margin-left:-26px; border:26px solid transparent; border-top:0; border-bottom:30px solid #fff; }
  .cap.small { font-size:43px; }
  .cap em { font-family:var(--font-heading); font-style:italic; font-weight:500; color:var(--coral); }
  .final .logo { position:absolute; left:50%; top:420px; width:560px; margin-left:-280px; }
  .final .host { position:absolute; left:0; right:0; top:900px; text-align:center; color:var(--gold-light); font-size:46px; font-weight:600; letter-spacing:.04em; }
  .final .wa { position:absolute; left:0; right:0; top:972px; text-align:center; color:#fff; font-size:50px; font-weight:600; }
  .final { background:#3B2055; }
  .final .quote { position:absolute; left:100px; right:100px; top:1080px; text-align:center; color:#fff; font-family:var(--font-heading); font-style:italic; font-weight:400; font-size:58px; line-height:1.22; text-wrap:balance; }
  .plat { position:absolute; left:80px; right:80px; top:1380px; height:270px; background:#fff; border-radius:36px; padding:26px 40px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:26px 44px; overflow:hidden; }
  .plat img { display:block; flex:none; }
  .final .fxall { position:absolute; left:0; top:0; width:1080px; height:1920px; pointer-events:none; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const ease = (x) => (x = Math.max(0, Math.min(1, x)), 1 - Math.pow(1 - x, 3));
const back = (x) => { x = Math.max(0, Math.min(1, x)); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mix = (a, b, p) => { const f = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const A = f(a), B = f(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * p).toString(16).padStart(2, '0')).join(''); };
const INK = '#2A1A12';

// ---------------- the five characters (fixed faces, skin, hair and clothes) ----------------
const CH = {
  camilo: { skin: '#F4CFA8', hair: '#2A1A12', kind: 'trunks', top: '#341D63', top2: '#5B3AA0', legs: '#341D63', accent: '#CBA54D', sandal: '#E0C585', style: 'short', acc: 'shades' },
  mama:   { hasBaby: true, fem: true, skin: '#F9DCC0', hair: '#3A2216', kind: 'suit', top: '#CBA54D', top2: '#EBD38F', legs: '#CBA54D', accent: '#FF6B5B', sandal: '#FF6B5B', style: 'long', acc: 'straw' },
  tia:    { fem: true, skin: '#F1C6A0', hair: '#1F1410', kind: 'suit', top: '#12B5B0', top2: '#55D9D4', legs: '#12B5B0', accent: '#FFC93C', sandal: '#FFC93C', style: 'curly', acc: 'pareo' },
  nino:   { skin: '#F4CFA8', hair: '#2A1A12', kind: 'trunks', top: '#FFC93C', top2: '#FFE380', legs: '#FFC93C', accent: '#FF6B5B', sandal: '#12B5B0', style: 'tuft', acc: 'bucket' },
};
const TR = {
  camilo: { kind: 'tee', legs: '#4A6A9E', accent: '#FFFFFF', sandal: '#FFFFFF', acc: 'cap' },
  mama:   { kind: 'tee', legs: '#4A6A9E', accent: '#FFFFFF', sandal: '#FFFFFF', acc: 'none', hasBaby: false },
  tia:    { kind: 'tee', legs: '#341D63', accent: '#FFFFFF', sandal: '#FFFFFF', acc: 'none' },
  nino:   { kind: 'tee', legs: '#4A6A9E', accent: '#FFFFFF', sandal: '#FFFFFF', acc: 'none', pack: true },
};
const CUR = { outfit: 'beach' };
let UID = 0;
function charSVG(k, outfit) {
  const c = outfit === 'travel' ? { ...CH[k], ...TR[k] } : CH[k], u = 'g' + (++UID);
  const defs = `<defs>
    <radialGradient id="${u}s" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="${mix(c.skin, '#FFFFFF', .38)}"/><stop offset=".6" stop-color="${c.skin}"/><stop offset="1" stop-color="${mix(c.skin, '#000000', .2)}"/></radialGradient>
    <linearGradient id="${u}t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c.top2}"/><stop offset="1" stop-color="${c.top}"/></linearGradient>
    <linearGradient id="${u}h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${mix(c.hair, '#FFFFFF', .28)}"/><stop offset="1" stop-color="${c.hair}"/></linearGradient></defs>`;
  const S = `url(#${u}s)`, T = `url(#${u}t)`, H = `url(#${u}h)`, ln = 'rgba(0,0,0,.12)';
  const leg = (x, cls) => `<g class="${cls}"><rect x="${x}" y="256" width="30" height="116" rx="13" fill="${c.kind === 'tee' ? c.legs : S}" stroke="${ln}" stroke-width="2"/>${c.kind === 'trunks' ? `<rect x="${x - 1}" y="246" width="32" height="68" rx="12" fill="${c.legs}" stroke="${ln}" stroke-width="2"/><rect x="${x + 12}" y="246" width="6" height="68" fill="${c.accent}"/>` : ''}${c.kind === 'tee' ? `<ellipse cx="${x + 10}" cy="380" rx="25" ry="13" fill="#FFFFFF" stroke="#D9D2E6" stroke-width="2"/><path d="M${x - 14} 384Q${x + 10} 394 ${x + 34} 384" stroke="${c.top}" stroke-width="4" fill="none" stroke-linecap="round"/>` : `<path d="M${x - 6} 381Q${x + 10} 368 ${x + 36} 381L${x + 34} 389Q${x + 10} 395 ${x - 4} 389Z" fill="${c.sandal}" stroke="${ln}" stroke-width="2"/><path d="M${x + 4} 378Q${x + 12} 362 ${x + 26} 378" stroke="${c.accent}" stroke-width="5" fill="none" stroke-linecap="round"/>`}</g>`;
  const legs = leg(68, 'legL') + leg(102, 'legR');
  const torso = `<path d="M56 118Q100 104 144 118L152 266Q100 280 48 266Z" fill="${S}" stroke="${ln}" stroke-width="2"/>`;
  const wear = c.kind === 'tee'
    ? `<path d="M54 118Q100 104 146 118L154 270Q100 284 46 270Z" fill="${T}" stroke="${ln}" stroke-width="2"/><path d="M84 110Q100 130 116 110" stroke="${mix(c.top, '#000000', .25)}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M52 258Q100 272 148 258" stroke="${mix(c.legs, '#000000', .3)}" stroke-width="8" fill="none"/>`
    : c.kind === 'trunks'
    ? `<path d="M49 238Q100 252 151 238L152 270Q100 284 48 270Z" fill="${c.legs}" stroke="${ln}" stroke-width="2"/><path d="M52 252Q100 266 148 252" stroke="${c.accent}" stroke-width="5" fill="none"/>`
    : `<path d="M62 152Q100 182 138 152L148 266Q100 280 52 266Z" fill="${T}" stroke="${ln}" stroke-width="2"/><path d="M72 154L86 112M128 154L114 112" stroke="${c.top}" stroke-width="10" stroke-linecap="round"/><path d="M70 200Q100 212 130 200" stroke="${c.accent}" stroke-width="5" fill="none" stroke-linecap="round"/>`
      + (c.acc === 'pareo' ? `<path d="M44 248Q100 232 156 248L174 336Q100 352 26 336Z" fill="#FFFFFF" stroke="${c.top}" stroke-width="3" opacity=".95"/><path d="M60 262L52 340M100 258V346M140 262L148 340" stroke="${c.top}" stroke-width="5" opacity=".55"/>` : '');
  const body = torso + wear;
  const neck = `<rect x="86" y="96" width="28" height="30" rx="10" fill="${mix(c.skin, '#000000', .12)}"/>`;
  const arm = (side) => {
    const x = side === 'L' ? 32 : 142, hx = side === 'L' ? 45 : 155;
    return `<g class="arm${side}"><rect x="${x}" y="120" width="26" height="74" rx="13" fill="${S}" stroke="${ln}" stroke-width="2"/><rect x="${x + 3}" y="184" width="20" height="56" rx="10" fill="${S}"/>${c.kind === 'tee' ? `<rect x="${x}" y="118" width="26" height="56" rx="13" fill="${T}" stroke="${ln}" stroke-width="2"/>` : ''}<circle cx="${hx}" cy="240" r="14" fill="${S}"/><g class="p${side}" transform="translate(${hx} 240)"><g class="p${side}i"></g></g></g>`;
  };
  const backHair = { long: `<path d="M52 62Q48 8 100 8Q152 8 148 62L154 156Q132 168 126 126L74 126Q68 168 46 156Z" fill="${H}"/>`,
    curly: [[62, 34], [82, 20], [104, 16], [126, 22], [142, 38], [150, 62], [50, 62], [144, 82], [56, 82]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="21" fill="${H}"/>`).join(''), short: '', tuft: '' }[c.style];
  const frontHair = { short: `<path d="M56 62Q54 12 100 12Q146 12 144 62Q136 36 100 36Q64 36 56 62Z" fill="${H}"/>`,
    long: `<path d="M58 56Q80 18 100 22Q130 20 142 56Q120 36 100 40Q76 38 58 56Z" fill="${H}"/>`,
    curly: `<path d="M60 48Q60 10 100 10Q140 10 140 48Q122 26 100 28Q78 26 60 48Z" fill="${H}"/>`,
    tuft: `<path d="M60 56Q58 14 100 16Q142 14 140 56Q126 34 110 42Q98 26 82 42Q70 40 60 56Z" fill="${H}"/>` }[c.style];
  const eye = (cx) => `<ellipse cx="${cx}" cy="64" rx="9.5" ry="10.5" fill="#FFFFFF"/><circle cx="${cx}" cy="65" r="6.2" fill="#3A2216"/><circle cx="${cx + 2}" cy="62.5" r="2.2" fill="#FFFFFF"/>`;
  const face = `<g class="eyes">${eye(83)}${eye(117)}</g>
    ${c.fem ? `<path d="M75 49Q83 44 92 48M108 48Q117 44 125 49" stroke="${mix(c.hair, '#9A7A65', .45)}" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M73 61l-5 -3M76 56l-4 -5M127 61l5 -3M124 56l4 -5" stroke="#2A1A12" stroke-width="2.6" stroke-linecap="round"/>` : `<path d="M72 48Q83 41 94 47M106 47Q117 41 128 48" stroke="${c.hair}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`}
    <path d="M97 73Q100 79 103 73" stroke="${mix(c.skin, '#000000', .3)}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="68" cy="80" r="9" fill="#FF6B5B" opacity=".32"/><circle cx="132" cy="80" r="9" fill="#FF6B5B" opacity=".32"/>
    <path class="mc" d="M84 86Q100 99 116 86" stroke="${c.fem ? '#C9505A' : '#3A1A1A'}" stroke-width="${c.fem ? 6 : 5}" fill="none" stroke-linecap="round"/>
    <g class="mo" style="display:none"><path d="M82 84Q100 114 118 84Z" fill="#3A1A1A"/><path d="M86 85Q100 91 114 85L113 90Q100 95 87 90Z" fill="#FFFFFF"/><ellipse cx="100" cy="99" rx="9" ry="5" fill="#FF6B5B"/></g>`;
  const accs = { shades: `<g><rect x="68" y="24" width="28" height="17" rx="8" fill="#251547"/><rect x="104" y="24" width="28" height="17" rx="8" fill="#251547"/><path d="M96 31h8" stroke="#251547" stroke-width="4"/><path d="M72 28h8" stroke="#fff" stroke-width="3" opacity=".6"/></g>`,
    cap: `<path d="M60 36Q62 -8 100 -8Q138 -8 140 36Z" fill="#FFFFFF" stroke="#D9D2E6" stroke-width="3"/><rect x="60" y="20" width="80" height="11" fill="#CBA54D"/><ellipse cx="100" cy="35" rx="54" ry="9" fill="#FFFFFF" stroke="#D9D2E6" stroke-width="3"/>`,
    straw: `<path d="M56 40Q58 -6 100 -6Q142 -6 144 40Z" fill="#F0D58C" stroke="#CBA54D" stroke-width="3"/><rect x="56" y="22" width="88" height="12" fill="#FF6B5B"/><ellipse cx="100" cy="40" rx="86" ry="17" fill="#E8C97A" stroke="#CBA54D" stroke-width="3"/>`,
    bucket: `<path d="M64 36Q66 4 100 4Q134 4 136 36Z" fill="#12B5B0" stroke="#251547" stroke-width="2"/><path d="M48 42Q100 20 152 42Q100 54 48 42Z" fill="#12B5B0" stroke="#251547" stroke-width="2"/><rect x="66" y="22" width="68" height="8" fill="#FFC93C"/>`, pareo: '' }[c.acc] || '';
  const pack = c.pack ? `<rect x="38" y="126" width="124" height="112" rx="30" fill="#FF6B5B" stroke="${ln}" stroke-width="2"/>` : '';
  const strap = c.pack ? `<path d="M72 116L74 206M128 116L126 206" stroke="#FF6B5B" stroke-width="12" stroke-linecap="round"/><rect x="66" y="196" width="68" height="12" rx="6" fill="#E0C585"/>` : '';
  const head = `<circle cx="59" cy="68" r="9" fill="${S}"/><circle cx="141" cy="68" r="9" fill="${S}"/><ellipse cx="100" cy="64" rx="42" ry="45" fill="${S}"/>`;
  const baby = c.hasBaby ? `<g class="baby"><g transform="translate(-27 -6) translate(153 200) scale(.9) translate(-153 -200)"><rect x="126" y="166" width="54" height="68" rx="26" fill="#FF6B5B" stroke="${ln}" stroke-width="2"/><path d="M142 190Q153 200 164 190" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="153" cy="146" r="29" fill="${S}"/><path d="M126 140Q130 112 153 114Q176 112 180 140Q166 126 153 130Q140 126 126 140Z" fill="${H}"/><circle cx="143" cy="148" r="4" fill="#3A2216"/><circle cx="163" cy="148" r="4" fill="#3A2216"/><circle cx="138" cy="158" r="5" fill="#FF6B5B" opacity=".35"/><circle cx="168" cy="158" r="5" fill="#FF6B5B" opacity=".35"/><path d="M146 160Q153 168 160 160" stroke="#3A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>${c.babyHat === false ? '' : '<path d="M127 128Q131 98 153 98Q175 98 179 128Z" fill="#FFFFFF" stroke="#D9D2E6" stroke-width="2"/><rect x="123" y="124" width="60" height="10" rx="5" fill="#12B5B0"/>'}<g class="bArm"><circle cx="180" cy="204" r="10" fill="${S}"/></g></g><circle cx="140" cy="212" r="12.5" fill="${S}" stroke="rgba(0,0,0,.12)" stroke-width="2"/></g>` : '';
  return `<svg viewBox="0 0 200 400">${defs}<ellipse cx="100" cy="392" rx="80" ry="12" fill="#251547" opacity=".2"/>${legs}${pack}${body}${strap}${neck}${arm('L')}<g class="head">${backHair}${head}${frontHair}${face}${accs}</g>${arm('R')}${baby}</svg>`;
}
function strollerSVG(u) {
  const S = CH.mama.skin, H = CH.mama.hair;
  return `<svg viewBox="0 0 220 200" style="width:220px;height:200px;overflow:visible"><defs><radialGradient id="${u}b" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="${mix(S, '#FFFFFF', .38)}"/><stop offset=".6" stop-color="${S}"/><stop offset="1" stop-color="${mix(S, '#000000', .2)}"/></radialGradient><linearGradient id="${u}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B3AA0"/><stop offset="1" stop-color="#341D63"/></linearGradient></defs>
  <ellipse cx="110" cy="196" rx="104" ry="9" fill="#251547" opacity=".2"/>
  <path d="M46 150L36 172M174 150L184 172" stroke="#251547" stroke-width="8" stroke-linecap="round"/>
  <path d="M24 100Q24 32 110 32Q196 32 196 100Z" fill="url(#${u}c)" stroke="#251547" stroke-width="3"/><path d="M30 94Q110 68 190 94" stroke="#CBA54D" stroke-width="7" fill="none"/>
  <path d="M34 104H186L172 156Q110 170 48 156Z" fill="#12B5B0" stroke="#251547" stroke-width="3"/>
  <g transform="translate(110 132) scale(.76) translate(-110 -132)"><rect x="82" y="96" width="56" height="52" rx="22" fill="#FF6B5B" stroke="rgba(0,0,0,.12)" stroke-width="2"/>
  <circle cx="110" cy="76" r="31" fill="url(#${u}b)"/><path d="M80 70Q84 40 110 42Q136 40 140 70Q124 56 110 60Q96 56 80 70Z" fill="${H}"/>
  <circle cx="99" cy="78" r="4.5" fill="#3A2216"/><circle cx="121" cy="78" r="4.5" fill="#3A2216"/><circle cx="92" cy="90" r="6" fill="#FF6B5B" opacity=".35"/><circle cx="128" cy="90" r="6" fill="#FF6B5B" opacity=".35"/><path d="M101 90Q110 100 119 90" stroke="#3A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g class="sArm"><circle cx="142" cy="112" r="11" fill="url(#${u}b)"/></g></g>
  <path d="M30 116Q110 134 190 116L174 158Q110 172 46 158Z" fill="#19C6C0" stroke="#251547" stroke-width="3"/><path d="M32 118Q110 136 188 118" stroke="#CBA54D" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="38" cy="172" r="26" fill="#251547"/><circle cx="38" cy="172" r="11" fill="#CBA54D"/><circle cx="182" cy="172" r="26" fill="#251547"/><circle cx="182" cy="172" r="11" fill="#CBA54D"/>
  <path d="M40 104L40 22M180 104L180 22" stroke="#251547" stroke-width="8" stroke-linecap="round"/><path d="M26 20H194" stroke="#CBA54D" stroke-width="12" stroke-linecap="round"/></svg>`;
}
function mk(stage, key, x, y, s) {
  const el = document.createElement('div'); el.className = 'fig'; el.innerHTML = charSVG(key, CUR.outfit); stage.appendChild(el);
  const q = (n) => el.querySelector(n);
  let stroller = null;
  if (key === 'mama' && CUR.outfit === 'travel') { stroller = document.createElement('div'); stroller.className = 'fig'; stroller.style.width = '220px'; stroller.style.height = '200px'; stroller.style.transformOrigin = '110px 190px'; stroller.innerHTML = strollerSVG('st' + (++UID)); stage.appendChild(stroller); }
  return { babyArms: !!q('.baby'), stroller, el, key, x, y, s, legL: q('.legL'), legR: q('.legR'), armL: q('.armL'), armR: q('.armR'), head: q('.head'), eyes: q('.eyes'), mc: q('.mc'), mo: q('.mo'), piL: q('.pLi'), piR: q('.pRi'), pL: q('.pL'), pR: q('.pR'), bArm: q('.bArm'), propL: null, propR: null };
}
function prop(f, side, svg, upright = true) { f['pi' + side].innerHTML = svg; f['prop' + side] = { upright }; }
function pose(f, o = {}) {
  const { look = 0, dx = 0, dy = 0, rot = 0, aL: aL0 = 0, aR: aR0 = 0, leg = 0, open = false, t = 0, sx = 1, sy = 1, vis = 1 } = o;
  const aL = f.stroller && aL0 < 40 ? 0 : aL0, aR = f.stroller && aR0 < 40 ? 0 : aR0;
  if (f.stroller) { f.stroller.style.opacity = vis; f.stroller.style.transform = `translate(${f.x + dx - 110}px,${f.y + 12 * f.s + dy - 190}px) scale(${f.s})`; const sa = f.stroller.querySelector('.sArm'); sa.style.transformOrigin = '120px 110px'; sa.style.transform = `translate(0px,${Math.sin(t * 7) * -6}px)`; }
  f.el.style.opacity = vis;
  f.el.style.transform = `translate(${f.x + dx - 100}px,${f.y + dy - 400}px) rotate(${rot}deg) scale(${f.s * sx},${f.s * sy})`;
  f.legL.style.transformOrigin = '83px 258px'; f.legL.style.transform = `rotate(${leg}deg)`;
  f.legR.style.transformOrigin = '117px 258px'; f.legR.style.transform = `rotate(${-leg}deg)`;
  f.armL.style.transformOrigin = '45px 128px'; f.armL.style.transform = `rotate(${aL}deg)`;
  f.armR.style.transformOrigin = '155px 128px'; f.armR.style.transform = `rotate(${f.babyArms ? 28 - Math.sin(t * 3) * 3 : -aR}deg)`;
  if (f.propL && f.propL.upright) f.piL.style.transform = `rotate(${-aL}deg)`;
  if (f.propR && f.propR.upright) f.piR.style.transform = `rotate(${aR}deg)`;
  const bl = ((t + f.x * 0.003) % 2.7) > 2.6 ? 0.1 : 1;
  f.eyes.style.transformOrigin = '100px 64px'; f.eyes.style.transform = `translate(${look * 5}px,0) scaleY(${bl})`;
  f.head.style.transformOrigin = '100px 112px'; f.head.style.transform = `translate(${look * 11}px,0) rotate(${look * 15}deg) scaleX(${1 - Math.abs(look) * .1})`;
  f.mc.style.display = open ? 'none' : ''; f.mo.style.display = open ? '' : 'none';
  if (f.bArm) { f.bArm.style.transformOrigin = '170px 200px'; f.bArm.style.transform = `rotate(${Math.sin(t * 9) * 45}deg)`; }

    el.innerHTML = `${ttl}<div class="panel"><svg class="bg" id="bg${i}" viewBox="0 0 920 900"></svg><div class="stage" id="st${i}"></div><svg class="fx" id="fx${i}" viewBox="0 0 920 900"></svg></div><div class="cap${v.small ? ' small' : ''}" id="cap${i}">${v.cap}</div>`;
  }
  app.appendChild(el);
  if (v.build) { CUR.outfit = v.travel ? 'travel' : 'beach'; v.build(document.getElementById('st' + i)); }
  return el;
});

function render(t) {
  V.forEach((v, i) => {
    const el = slides[i], local = t - START[i];
    el.style.display = local > -0.02 && local < DUR[i] + 0.7 ? '' : 'none';
    el.style.zIndex = i;
    if (local <= -0.02 || local >= DUR[i] + 0.7) return;
    const lt = Math.max(0, local), k = i === 0 ? 1 : ease(local / .35);
    el.style.transform = `translateX(${(1 - k) * 1080}px)`;
    const tt = el.querySelector('.ttl'); const kk = i === 0 ? 1 : back((lt - .1) / .5); tt.style.opacity = clamp(kk * 3); tt.style.transform = `translateY(${(1 - kk) * -40}px)`;
    if (v.final) {
      const L = back((lt - .15) / .8);
      const logo = document.getElementById('flogo'); logo.style.opacity = clamp(L * 3); logo.style.transform = `scale(${.6 + .4 * L})`;
      [['fhost', .9], ['fwa', 1.1], ['fq', 1.35], ['fplat', 1.7]].forEach(([id, d]) => { const q = back((lt - d) / .5), e = document.getElementById(id); e.style.opacity = clamp(q * 3); e.style.transform = `translateY(${(1 - q) * 50}px)`; });
      let s = ''; const cols = ['#FFC93C', '#FF5FA2', '#12B5B0', '#FF6B5B', '#FFFFFF', '#CBA54D'];
      for (let n = 0; n < 40; n++) { const r = (Math.sin(n * 91.7) + 1) / 2, r2 = (Math.sin(n * 47.3 + 2) + 1) / 2, x = 30 + r * 1020, y = -60 + ((lt * (180 + r2 * 220) + r2 * 1900) % 2000), z = 9 + r2 * 10; s += n % 3 ? `<circle cx="${x}" cy="${y}" r="${z * .7}" fill="${cols[n % 6]}"/>` : `<rect x="${x}" y="${y}" width="${z * 1.7}" height="${z * .7}" rx="3" fill="${cols[n % 6]}" transform="rotate(${lt * 240 + n * 40} ${x} ${y})"/>`; }
      const sx = 1080 * clamp((lt - .5) / 1.0); s += `<rect x="${-200 + sx * 1.4}" y="440" width="90" height="480" fill="#fff" opacity="${sx > 0 && sx < 1000 ? .22 : 0}" transform="skewX(-18)"/>`;
      document.getElementById('fxf').innerHTML = s;
      return;
    }
    document.getElementById('bg' + i).innerHTML = v.bg(lt);
    document.getElementById('fx' + i).innerHTML = v.frame(lt) || '';
    const cap = document.getElementById('cap' + i), q = i === 0 ? 1 : back((lt - .35) / .5); cap.style.opacity = clamp(q * 3); cap.style.transform = `translateY(${(1 - q) * 60}px)`;
  });
}
render(0);
</script>
</body>
